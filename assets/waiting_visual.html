<div class="wb-wait-layer" id="wb-wait-layer" role="status" aria-live="polite" aria-label="视频生成等待动画">
  <div class="wb-wait-sky" aria-hidden="true"><div class="wb-wait-lattice"></div><div class="wb-wait-flare"></div><div class="wb-wait-noise"></div></div>
  <div class="wb-wait-topbar">
    <span class="wb-wait-live"><i></i> NEURAL RENDER / ACTIVE</span>
    <span class="wb-wait-elapsed"><span class="wb-wait-clockdot"></span> 已等待 <strong id="wb-wait-clock">00:00</strong></span>
  </div>
  <div class="wb-wait-core" aria-hidden="true">
    <div class="wb-wait-halo"></div>
    <div class="wb-wait-orbit orbit-a"><i></i><b></b></div>
    <div class="wb-wait-orbit orbit-b"><i></i><b></b></div>
    <div class="wb-wait-orbit orbit-c"></div>
    <div class="wb-wait-dial"><span class="wb-wait-sweep"></span><span class="wb-wait-center"><svg viewBox="0 0 48 48" fill="none"><path d="M17 13.5 35 24 17 34.5v-21Z" fill="currentColor" opacity=".96"/><rect x="10" y="17" width="3" height="14" rx="1.5" fill="currentColor" opacity=".58"/></svg></span></div>
    <div class="wb-wait-spark spark-a"></div><div class="wb-wait-spark spark-b"></div><div class="wb-wait-spark spark-c"></div>
  </div>
  <div class="wb-wait-bottom">
    <div class="wb-wait-title">正在构建你的画面<span class="wb-wait-dots"><i>.</i><i>.</i><i>.</i></span></div>
    <p class="wb-wait-desc" id="wb-wait-desc">视频任务已发起，正在等待推理服务返回结果</p>
    <div class="wb-wait-equalizer" aria-hidden="true">
      <i style="--n:1"></i><i style="--n:2"></i><i style="--n:3"></i><i style="--n:4"></i><i style="--n:5"></i><i style="--n:6"></i><i style="--n:7"></i><i style="--n:8"></i><i style="--n:9"></i><i style="--n:10"></i><i style="--n:11"></i><i style="--n:12"></i><i style="--n:13"></i><i style="--n:14"></i><i style="--n:15"></i><i style="--n:16"></i><i style="--n:17"></i><i style="--n:18"></i><i style="--n:19"></i><i style="--n:20"></i><i style="--n:21"></i><i style="--n:22"></i><i style="--n:23"></i><i style="--n:24"></i>
    </div>
    <div class="wb-wait-flow" aria-label="创作要素展示">
      <span><i></i> PROMPT</span><em></em><span><i></i> MULTIMODAL</span><em></em><span><i></i> RENDER</span>
    </div>
    <div class="wb-wait-track" role="progressbar" aria-label="视频生成中，暂不显示实际进度百分比"><i></i></div>
    <div class="wb-wait-actions"><button id="wb-effect-toggle" type="button" aria-pressed="false">关闭动态光效</button><button id="wb-wait-dismiss" type="button" title="只收起等待画面，不取消推理">收起动画</button></div>
    <p class="wb-wait-disclaimer">实时计时仅表示等待时长 · 动态条不是推理进度</p>
  </div>
</div>
